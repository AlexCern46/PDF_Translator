version: '3.8'


services:
  api:
    build: ./app
    container_name: fastapi_app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0"]
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - worker
      - minio
    env_file:
      - .env
    volumes:
      - .:/app

  redis:
    image: redis:alpine
    container_name: redis_broker
    ports:
      - "6379:6379"

  worker:
    build: ./app
    container_name: celery_worker
    command: ["celery", "-A", "app.core.celery_config.celery", "worker", "--loglevel=info", "-c6"]
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - .:/app

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-storage:/data
    env_file:
      - .env
    command: ['server', '/data', '--console-address', ':9001']

volumes:
  minio-storage:
